# TigerDuck backend stack.
#
# Networks:
#   * tigerduck-db   — internal-only bridge for postgres and its clients: the
#                      backend, the portal, the one-shot monitor-role,
#                      postgres-exporter, sql-exporter and Grafana.
#                      internal:true means the network has NO outbound NAT,
#                      so postgres cannot reach the public internet even if
#                      it tried.
#   * proxy-net      — shared with nginx-proxy-manager. External. NPM proxies
#                      api.tigerduck.app to `http://tigerduck-internal:40000`
#                      over this network (container DNS by name). The
#                      backend, the portal and Grafana join it; postgres
#                      stays off it.
#   * tigerduck-monitoring — internal-only bridge for Prometheus, Loki and
#                      what they collect from. Grafana joins it to query them.
#
# No ports are published to the host for any service. Everything from
# outside reaches the stack over proxy-net (nginx-proxy-manager / cloudflared).
# Postgres is reachable only from the services on tigerduck-db. Grafana is
# the one monitoring service on proxy-net, served under the portal host at
# /grafana.
#
# llama-server stays NATIVE on the host (Docker Desktop on Mac can't surface
# Metal GPU). The backend reaches it via Docker Desktop's host-gateway:
# TIGERDUCK_LLM_BASE_URL=http://host.docker.internal:40001/v1 in .env.

name: tigerduck

services:
  postgres:
    image: postgres:17-alpine
    container_name: tigerduck-db
    restart: unless-stopped
    networks: [tigerduck-db]
    environment:
      POSTGRES_USER: tigerduck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tigerduck
      # Log timestamps in local time for easier readability. Storage stays UTC
      # (TIMESTAMPTZ columns are always UTC internally).
      TZ: Asia/Taipei
    volumes:
      - tigerduck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigerduck -d tigerduck"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    # container_name doubles as the DNS name that nginx-proxy-manager uses
    # over proxy-net. Do NOT change without updating NPM's proxy target.
    container_name: tigerduck-internal
    restart: unless-stopped
    # tigerduck-monitoring so Prometheus can scrape the metrics port (9000).
    # The alias exists only on that network; the backend binds its metrics
    # port to the address it resolves to (TIGERDUCK_METRICS_HOST below), so
    # nothing on proxy-net or tigerduck-db can reach the port.
    networks:
      tigerduck-db:
      proxy-net:
      tigerduck-monitoring:
        aliases: [tigerduck-internal-metrics]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      TIGERDUCK_METRICS_HOST: tigerduck-internal-metrics
    # Mount the APNs auth key read-only. Also makes cert rotation a host-side
    # operation (drop the new .p8, restart container) instead of a rebuild.
    volumes:
      - ./server/secrets:/app/server/secrets:ro
    # host-gateway resolves `host.docker.internal` to the Docker host. Needed
    # on Linux for parity with Mac (on macOS Docker Desktop sets this for free,
    # explicit entry is harmless).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  portal:
    build: ./portal
    container_name: tigerduck-portal
    restart: unless-stopped
    # tigerduck-db so the status page can directly query postgres + export
    # can pg_dump; proxy-net so nginx-proxy-manager / cloudflared can
    # reach it in prod. The dev override swaps proxy-net for a host bridge
    # so port 40010 publishes.
    networks: [tigerduck-db, proxy-net]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Set by _compose-files.sh (sourced by start.sh) — the portal has
      # no view of the host's network interfaces from inside its netns,
      # so we hand it the comma-joined IPs to render on the status page.
      TIGERDUCK_HOST_LAN_IPS: ${TIGERDUCK_HOST_LAN_IPS:-}
    volumes:
      # Read-only docker socket lets the status page talk to the engine
      # API (HTTP-over-UDS) for `containers/{name}/json` + `logs`. NO
      # write ops (start/stop/restart) per the design: the import flow
      # asks the user to restart manually.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mirror the backend's secrets mount RO so the status page can
      # report "is the .p8 / fcm.json on disk?" without exposing contents.
      - ./server/secrets:/backend-secrets:ro

  # --- Monitoring -----------------------------------------------------------
  # Metrics: postgres-exporter, sql-exporter, backend :9000 → Prometheus.
  # Logs:    every container → Alloy → Loki.
  # Both read by Grafana.
  #
  # Every image is pinned by tag and digest, so a re-pushed tag can't change
  # what runs. The digest is the multi-arch index, valid on arm64 and amd64.
  # To upgrade one: change the tag, then take the new digest from
  #   docker buildx imagetools inspect <image>:<tag>
  # Bumping Grafana also means bumping GF_PLUGINS_PREINSTALL below.
  # Config lives in monitoring/. See the README's Monitoring section.

  # One-shot: creates or refreshes the read-only tigerduck_monitor role the
  # exporter and Grafana log in as, then exits. Runs on every `up`.
  monitor-role:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: tigerduck-monitor-role
    restart: "no"
    networks: [tigerduck-db]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: tigerduck-db
      PGUSER: tigerduck
      PGDATABASE: tigerduck
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Its own secret, never POSTGRES_PASSWORD: whoever reads it from an
      # exporter's or Grafana's environment gets a read-only login, not the
      # superuser. ./start.sh generates one into .env when it's missing.
      MONITOR_DB_PASSWORD: ${TIGERDUCK_MONITOR_DB_PASSWORD:-}
    volumes:
      - ./monitoring/postgres/monitor-role.sh:/monitor-role.sh:ro
    entrypoint: ["sh", "/monitor-role.sh"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: tigerduck-postgres-exporter
    restart: unless-stopped
    networks: [tigerduck-db, tigerduck-monitoring]
    depends_on:
      monitor-role:
        condition: service_completed_successfully
    environment:
      DATA_SOURCE_URI: tigerduck-db:5432/tigerduck?sslmode=disable
      DATA_SOURCE_USER: tigerduck_monitor
      DATA_SOURCE_PASS: ${TIGERDUCK_MONITOR_DB_PASSWORD:-}

  # App-level counts from SQL (devices online, push queue, sync jobs, …)
  # as Prometheus gauges, so they get a history.
  sql-exporter:
    image: burningalchemist/sql_exporter:0.24.9@sha256:6c554722faccd4b54342ccd765f87b26e8e65fba2a8cddc60bec6de336ecf2e0
    container_name: tigerduck-sql-exporter
    restart: unless-stopped
    networks: [tigerduck-db, tigerduck-monitoring]
    depends_on:
      monitor-role:
        condition: service_completed_successfully
    command: ["-config.file=/etc/sql_exporter/sql_exporter.yml"]
    environment:
      # URL form, so a password with URL-reserved characters must be
      # percent-encoded. secrets.token_urlsafe output never needs it.
      SQLEXPORTER_TARGET_DSN: postgres://tigerduck_monitor:${TIGERDUCK_MONITOR_DB_PASSWORD:-}@tigerduck-db:5432/tigerduck?sslmode=disable
    volumes:
      - ./monitoring/sql-exporter:/etc/sql_exporter:ro

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: tigerduck-loki
    restart: unless-stopped
    networks: [tigerduck-monitoring]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - tigerduck_loki:/loki

  # Ships every container's logs in this project to Loki. Reads them over
  # the docker socket, which (even read-only) is root-equivalent on the
  # host, the same trade the portal already makes for its log tabs.
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: tigerduck-alloy
    restart: unless-stopped
    networks: [tigerduck-monitoring]
    depends_on: [loki]
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Remembers how far into each container's log it has read, so a
      # restart doesn't ship everything again.
      - tigerduck_alloy:/var/lib/alloy/data

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: tigerduck-prometheus
    restart: unless-stopped
    # Internal network only: nothing outside the stack reaches Prometheus.
    # Grafana is its only reader.
    networks: [tigerduck-monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # Re-reads prometheus.yml every 30s when it changes: a bind-mounted
      # file edit doesn't restart the container, so without this a pulled
      # config change would sit unused until someone restarts Prometheus.
      - --config.auto-reload
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tigerduck_prometheus:/prometheus

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: tigerduck-grafana
    restart: unless-stopped
    # proxy-net so NPM can route <portal host>/grafana here, and for the
    # outbound fetch of Cloudflare's signing keys. tigerduck-db for the SQL
    # datasource.
    networks: [tigerduck-monitoring, tigerduck-db, proxy-net]
    depends_on:
      monitor-role:
        condition: service_completed_successfully
    environment:
      GF_SERVER_ROOT_URL: ${TIGERDUCK_GRAFANA_ROOT_URL:-https://portal.tigerduck.app/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # No Grafana login. A visitor is signed in from the JWT that
      # Cloudflare Access attaches to every request it lets through,
      # checked against the team's signing keys and the Access app's AUD
      # tag. A request that skipped Access (LAN straight to NPM, another
      # container on proxy-net) has no valid token and gets nothing. With
      # the two TIGERDUCK_CF_ACCESS_* values unset nobody gets in, which
      # is the safe way to be misconfigured. Dev mode swaps all of this
      # for anonymous access (docker-compose.dev.yml).
      GF_AUTH_JWT_ENABLED: "true"
      GF_AUTH_JWT_HEADER_NAME: Cf-Access-Jwt-Assertion
      GF_AUTH_JWT_EMAIL_CLAIM: email
      GF_AUTH_JWT_USERNAME_CLAIM: email
      GF_AUTH_JWT_JWK_SET_URL: https://${TIGERDUCK_CF_ACCESS_TEAM_DOMAIN:-}/cdn-cgi/access/certs
      GF_AUTH_JWT_CACHE_TTL: 60m
      GF_AUTH_JWT_EXPECT_CLAIMS: '{"iss": "https://${TIGERDUCK_CF_ACCESS_TEAM_DOMAIN:-}", "aud": "${TIGERDUCK_CF_ACCESS_AUD:-}"}'
      GF_AUTH_JWT_AUTO_SIGN_UP: "true"
      # Everyone Access lets in is an operator, same as the portal.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana 13 fetches its own plugins (the Loki / Prometheus / Postgres
      # datasources, the Drilldown apps) from grafana.com rather than
      # shipping them all in the image, and by default updates them to
      # whatever is newest on every start, in the background — a page opened
      # during the swap fails with "could not load plugin", and dev and prod
      # drift apart. So: every preinstalled plugin is pinned to the newest
      # version compatible with the Grafana above, installed before Grafana
      # starts serving, and never auto-updated. An installed plugin at the
      # pinned version is left alone, so restarts need no network; a fresh
      # volume needs grafana.com reachable once. To see what's newest for a
      # Grafana version: https://grafana.com/api/plugins/<id>/versions
      GF_PLUGINS_PREINSTALL: >-
        grafana-lokiexplore-app@2.6.0,
        grafana-metricsdrilldown-app@2.5.1,
        grafana-exploretraces-app@2.2.1,
        grafana-pyroscope-app@2.3.1,
        grafana-advisor-app@1.1.0,
        loki@13.2.1,
        prometheus@13.2.2,
        grafana-postgresql-datasource@13.0.4,
        grafana-pyroscope-datasource@13.0.6,
        elasticsearch@12.9.1,
        influxdb@13.1.6,
        jaeger@13.0.4,
        mssql@13.0.6,
        mysql@13.1.3,
        opentsdb@13.0.4,
        stackdriver@12.6.2,
        tempo@13.2.2,
        zipkin@12.4.9
      GF_PLUGINS_PREINSTALL_ASYNC: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # Read by monitoring/grafana/provisioning/datasources/datasources.yml.
      TIGERDUCK_MONITOR_DB_PASSWORD: ${TIGERDUCK_MONITOR_DB_PASSWORD:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - tigerduck_grafana:/var/lib/grafana

networks:
  tigerduck-db:
    # Explicit name avoids the "<project>_<key>" prefix that compose adds by
    # default, so the network is predictably named regardless of where it is
    # invoked from.
    name: tigerduck-db
    # internal:true → no NAT to the host's default route. Postgres has no path
    # to the public internet from this network.
    internal: true
  tigerduck-monitoring:
    name: tigerduck-monitoring
    internal: true
  proxy-net:
    external: true

volumes:
  tigerduck_pgdata:
  tigerduck_prometheus:
  tigerduck_grafana:
  tigerduck_loki:
  tigerduck_alloy:
