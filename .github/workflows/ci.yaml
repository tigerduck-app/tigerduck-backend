name: CI

# Compile + test gate for PRs. This repo had no automated checks at all until
# now: the React 18→19 / Tailwind 3→4 / Vite 6→8 / TypeScript 5→7 jump landed
# with nothing verifying it built, and the only thing standing between a
# broken portal and a deploy was whoever remembered to run the build locally.
#
# Three jobs, deliberately narrow:
#   server-tests  the pytest suite, against a real Postgres — the
#                 fixtures DROP/CREATE their own database, so a throwaway
#                 service container is the honest way to run them.
#   portal-web    `tsc -b && vite build`. The typecheck is the point; a
#                 dependency bump that breaks types fails here, not on deploy.
#   portal-app    the operator portal's Python. Checks the lockfile resolves
#                 and the app imports — which is what actually broke when
#                 routes/moodle.py became a package — then runs its tests.
#
# No Docker build, no lint gate, no coverage threshold. Add them when they
# would have caught something.
#
# Each job runs only when its own code changed: documentation alone runs
# nothing. The server suite also runs for portal Python, since the portal's
# database-backed tests live in server/tests.

on:
  pull_request:
    branches: [ dev, main ]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge commit and its base.
          fetch-depth: 2

      - name: Changed paths
        id: paths
        run: |
          # Both sides of a rename, and paths unquoted so non-ASCII names still match.
          files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          files=$(printf '%s\n' "$files" \
            | grep -vE '\.md$|^(docs|\.greptile|\.github/ISSUE_TEMPLATE)/|^LICENSE' || true)
          printf '%s\n' "$files"
          any() { grep -q . && echo true || echo false; }
          if printf '%s\n' "$files" | grep -qx '\.github/workflows/ci\.yaml'; then
            printf 'server=true\nweb=true\napp=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "server=$(printf '%s\n' "$files" | grep -vE '^portal/web/' | any)"
            echo "web=$(printf '%s\n' "$files" | grep -E '^portal/web/' | any)"
            echo "app=$(printf '%s\n' "$files" | grep -E '^portal/' | grep -vE '^portal/web/' | any)"
          } >> "$GITHUB_OUTPUT"

  server-tests:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches docker-compose.yml so a test passing here means the same
        # server version the stack actually deploys against.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tigerduck
          POSTGRES_PASSWORD: tigerduck
          # server/tests/conftest.py connects to the `tigerduck` database as
          # admin, then drops and recreates `tigerduck_test` per session. The
          # admin database has to exist before the first connection.
          POSTGRES_DB: tigerduck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tigerduck -d tigerduck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py reads this and falls back to the same localhost URL, so
      # the suite runs identically here and on a developer machine.
      TIGERDUCK_TEST_DATABASE_URL: postgresql+asyncpg://tigerduck:tigerduck@localhost:5432/tigerduck_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # server/i18n.py reads its push-copy bundles from the
          # app-translation submodule. Without it every test that composes
          # a push -- test_i18n, test_reauth_push and the rest -- fails.
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock is stale rather than silently resolving
        # something the lockfile does not describe.
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest server/tests -q

  portal-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal/web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Vite 8 requires Node 20.19+/22.12+, and vite.config.ts uses
          # `import.meta.dirname`, which needs 20.11+. 22 clears both.
          node-version: '26'
          cache: npm
          cache-dependency-path: portal/web/package-lock.json

      - name: Install dependencies
        # `ci` rather than `install` so a lockfile that disagrees with
        # package.json is an error instead of a silent update.
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  portal-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: portal/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Import the app
        # The tests import only the routes they cover, so this is what
        # proves every module still imports. A package split that leaves a
        # route module unreferenced, or an __init__ that forgets to
        # re-export, fails right here.
        run: uv run --frozen python -c "import app.main; print('portal app imports OK')"

      - name: Run tests
        # No database: the tests drive routes that only read settings and
        # request headers.
        run: uv run --frozen pytest -q
