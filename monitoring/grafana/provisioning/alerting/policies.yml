# Every alert goes to tigerduck-oncall. Replaces the whole notification
# policy tree, so routes added in the UI do not survive a restart.
apiVersion: 1

policies:
  - orgId: 1
    receiver: tigerduck-oncall
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Once as a link starts failing and once as it recovers, not every 4h.
      - receiver: tigerduck-oncall
        object_matchers: [['alertname', '=', 'Link check failing']]
        repeat_interval: 8760h
