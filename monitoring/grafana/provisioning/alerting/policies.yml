# Every alert goes to tigerduck-oncall. Replaces the whole notification
# policy tree, so routes added in the UI do not survive a restart.
apiVersion: 1

policies:
  - orgId: 1
    receiver: tigerduck-oncall
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # A set stays under 60 days for weeks; weekly is reminder enough.
      - receiver: tigerduck-oncall
        object_matchers: [['alertname', '=', 'TLS pin set expiring']]
        repeat_interval: 168h
