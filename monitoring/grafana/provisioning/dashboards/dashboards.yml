# Loads every JSON file in monitoring/grafana/dashboards into the TigerDuck
# folder. The files are generated by monitoring/grafana/build_dashboards.py;
# UI edits to these dashboards can't be saved. To change one, edit the
# script and run it.
apiVersion: 1

providers:
  - name: tigerduck
    folder: TigerDuck
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
