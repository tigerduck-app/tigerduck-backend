[project]
name = "tigerduck-portal"
version = "3.8.2"
description = "Stateless operator portal for the TigerDuck backend stack. Surfaces stack status, per-container logs, and pg_dump-based export/import. Its API requires a Cloudflare Access JWT outside development."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
    # Direct DB access for status pings + export pg_dump.
    "asyncpg>=0.30",
    # Pydantic settings reads TIGERDUCK_* env from the container env.
    "pydantic-settings>=2.7",
    # access.py passes cooldown_duration, tested on this version.
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # The async tests run on anyio's pytest plugin (pytest.mark.anyio).
    "anyio>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` is the portal's import root. Put the portal directory on the path
# so the tests import it the way uvicorn does, whatever the install mode.
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
