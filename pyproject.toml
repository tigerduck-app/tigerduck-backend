[project]
name = "backend"
version = "3.2.0"
description = "TigerDuck push notification server (FastAPI + APScheduler + APNs + bulletin LLM classifier)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    # HTTP_422_UNPROCESSABLE_CONTENT (live_activities_v3) first ships in
    # 0.48; FastAPI alone allows older.
    "starlette>=0.48.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "aioapns>=3.4",
    "firebase-admin>=6.5.0",
    "apscheduler>=3.10.4",
    "pyjwt[crypto]>=2.10.0",
    "structlog>=24.4.0",
    "httpx[http2]>=0.28.1",
    "selectolax>=1.0.0",
    # 2.3 writes underline as raw <u> HTML, which the apps show as literal
    # text, and changes body_md enough to break content_hash dedup against
    # bulletins stored before it. test_bulletin_scraper pins the shape.
    "trafilatura>=2.0.0,<2.3",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
